<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chess Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0d0d0d;
  --panel: #141414;
  --border: #2a2010;
  --gold: #c9a84c;
  --gold-dim: #7a6330;
  --gold-bright: #e8c870;
  --light-sq: #f0d9b5;
  --dark-sq: #b58863;
  --light-sq-hl: #f6f669;
  --dark-sq-hl: #baca2b;
  --light-sq-legal: #cdd46f;
  --dark-sq-legal: #aaa23a;
  --check-sq: #ff4444;
  --text: #e8dcc8;
  --text-dim: #8a7a5a;
  --captured-bg: #1a1a1a;
  --move-bg: #1e1e1e;
  --btn: #1e1a10;
  --btn-hover: #2e2818;
  --white-piece: #ffffff;
  --black-piece: #1a1008;
  --shadow: 0 4px 24px rgba(0,0,0,0.8);
  --board-size: 560px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Crimson Pro', serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(201,168,76,0.04) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(181,136,99,0.04) 0%, transparent 60%);
}

header {
  text-align: center;
  margin-bottom: 28px;
}
header h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 700;
  letter-spacing: 0.1em;
  background: linear-gradient(135deg, var(--gold), var(--gold-bright), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
}
header p {
  font-style: italic;
  color: var(--text-dim);
  font-size: 1rem;
  margin-top: 4px;
  letter-spacing: 0.05em;
}

/* Setup Screen */
#setup-screen {
  width: 100%;
  max-width: 460px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 32px;
  box-shadow: var(--shadow);
}
#setup-screen h2 {
  font-family: 'Cinzel', serif;
  color: var(--gold);
  font-size: 1.2rem;
  margin-bottom: 24px;
  text-align: center;
  letter-spacing: 0.08em;
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 0.85rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.btn-group {
  display: flex;
  gap: 8px;
}
.btn-toggle {
  flex: 1;
  padding: 10px;
  background: var(--btn);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  font-family: 'Cinzel', serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.05em;
}
.btn-toggle:hover { background: var(--btn-hover); color: var(--text); }
.btn-toggle.active {
  background: linear-gradient(135deg, #2a2010, #3a3015);
  border-color: var(--gold-dim);
  color: var(--gold);
}

.difficulty-slider {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.difficulty-slider input[type=range] {
  width: 100%;
  accent-color: var(--gold);
  cursor: pointer;
}
.difficulty-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  color: var(--text-dim);
}

.btn-start {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #2a2010, #3d3018);
  border: 1px solid var(--gold-dim);
  border-radius: 8px;
  color: var(--gold-bright);
  font-family: 'Cinzel', serif;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.1em;
  transition: all 0.25s;
  margin-top: 8px;
}
.btn-start:hover {
  background: linear-gradient(135deg, #3a3015, #504020);
  border-color: var(--gold);
  box-shadow: 0 0 20px rgba(201,168,76,0.2);
}

/* Game Screen */
#game-screen { display: none; width: 100%; max-width: 1060px; }

.game-layout {
  display: flex;
  flex-direction: row;
  gap: 24px;
  align-items: start;
  justify-content: center;
}
@media (max-width: 900px) {
  .game-layout {
    flex-direction: column;
    align-items: center;
  }
  .side-panel-left { order: 2; flex-direction: row; flex-wrap: wrap; }
  .side-panel-right { order: 3; flex-direction: row; flex-wrap: wrap; }
  .board-section { order: 1; }
}

.side-panel-left, .side-panel-right {
  width: 200px;
  min-width: 200px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
@media (max-width: 900px) {
  .side-panel-left, .side-panel-right { width: 100%; max-width: 560px; min-width: unset; flex-direction: row; flex-wrap: wrap; }
}

/* Board */
.board-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.board-wrapper {
  position: relative;
}
.board-coords {
  display: flex;
  font-family: 'Cinzel', serif;
  font-size: 0.65rem;
  color: var(--gold-dim);
  letter-spacing: 0;
}
.coords-ranks {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  padding: 4px 6px 4px 0;
  height: 560px;
}
.coords-files {
  display: flex;
  justify-content: space-around;
  padding: 4px 0 0 4px;
  width: 560px;
  margin-left: 20px;
}

#board {
  display: grid;
  grid-template-columns: repeat(8, 70px);
  grid-template-rows: repeat(8, 70px);
  width: 560px;
  height: 560px;
  min-width: 560px;
  min-height: 560px;
  border: 3px solid #5a3e28;
  box-shadow:
    0 0 0 1px #3a2a18,
    0 0 40px rgba(0,0,0,0.9),
    inset 0 0 0 1px rgba(255,255,255,0.05);
  border-radius: 4px;
  overflow: hidden;
}

.sq {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: filter 0.1s;
  user-select: none;
}
.sq.light { background: var(--light-sq); }
.sq.dark  { background: var(--dark-sq); }
.sq.selected.light { background: var(--light-sq-hl); }
.sq.selected.dark  { background: var(--dark-sq-hl); }
.sq.last-move.light { background: var(--light-sq-hl); opacity: 0.85; }
.sq.last-move.dark  { background: var(--dark-sq-hl); opacity: 0.85; }
.sq.in-check { background: var(--check-sq) !important; }

.sq:hover:not(.selected) { filter: brightness(1.08); }

/* Legal move dots */
.sq.legal-move::after {
  content: '';
  position: absolute;
  width: 30%;
  height: 30%;
  background: rgba(0,0,0,0.2);
  border-radius: 50%;
  pointer-events: none;
  z-index: 2;
}
.sq.legal-capture::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.15);
  border-radius: 50%;
  box-shadow: inset 0 0 0 6px rgba(0,0,0,0.2);
  pointer-events: none;
  z-index: 2;
}

/* Pieces using Unicode chess symbols */
.piece {
  font-size: 52px;
  line-height: 1;
  z-index: 1;
  pointer-events: none;
  transition: transform 0.15s;
}
/* White pieces — ivory with strong shadow for visibility */
.piece.white-piece {
  color: #f5ead0;
  filter: drop-shadow(0 1px 0 #8a6030) drop-shadow(1px 2px 3px rgba(0,0,0,0.7));
}
/* Black pieces — near-black with light outline so they're clearly dark */
.piece.black-piece {
  color: #1a0f06;
  filter: drop-shadow(0 0 1px #c8a060) drop-shadow(1px 2px 3px rgba(0,0,0,0.9));
}
.sq.selected .piece { transform: scale(1.1); }

/* Promotion modal */
#promo-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
#promo-modal.active { display: flex; }
.promo-box {
  background: var(--panel);
  border: 1px solid var(--gold-dim);
  border-radius: 12px;
  padding: 28px;
  text-align: center;
  box-shadow: var(--shadow);
}
.promo-box h3 {
  font-family: 'Cinzel', serif;
  color: var(--gold);
  margin-bottom: 20px;
  font-size: 1rem;
  letter-spacing: 0.08em;
}
.promo-pieces {
  display: flex;
  gap: 12px;
  justify-content: center;
}
.promo-piece {
  font-size: 2.8rem;
  cursor: pointer;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--btn);
  transition: all 0.2s;
  filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.5));
}
.promo-piece:hover {
  background: var(--btn-hover);
  border-color: var(--gold-dim);
  transform: scale(1.1);
}

/* Side panels */
.panel-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.panel-card h4 {
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.status-badge {
  font-family: 'Cinzel', serif;
  font-size: 0.9rem;
  color: var(--gold);
  text-align: center;
  line-height: 1.4;
}
.status-badge.danger { color: #e05555; }
.status-badge.success { color: #7bc67e; }

.captured-pieces {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  min-height: 32px;
  font-size: 1.2rem;
  line-height: 1.2;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5));
}

.move-list {
  max-height: 180px;
  overflow-y: auto;
  font-family: 'Crimson Pro', serif;
  font-size: 0.9rem;
  scrollbar-width: thin;
  scrollbar-color: var(--gold-dim) transparent;
}
.move-pair {
  display: flex;
  gap: 6px;
  padding: 3px 0;
  border-bottom: 1px solid rgba(42,32,16,0.5);
  align-items: center;
}
.move-pair:last-child { border-bottom: none; }
.move-num {
  color: var(--text-dim);
  font-size: 0.8rem;
  width: 22px;
  flex-shrink: 0;
}
.move-uci {
  color: var(--text);
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 0.85rem;
  letter-spacing: 0.05em;
}
.move-uci.latest {
  background: rgba(201,168,76,0.15);
  color: var(--gold);
}

.btn-action {
  width: 100%;
  padding: 9px 12px;
  background: var(--btn);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  font-family: 'Cinzel', serif;
  font-size: 0.75rem;
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: all 0.2s;
}
.btn-action:hover {
  background: var(--btn-hover);
  color: var(--text);
  border-color: var(--gold-dim);
}
.btn-action.primary {
  border-color: var(--gold-dim);
  color: var(--gold-dim);
}
.btn-action.primary:hover { color: var(--gold); border-color: var(--gold); }

/* Thinking indicator */
.thinking {
  display: none;
  text-align: center;
  font-style: italic;
  color: var(--text-dim);
  font-size: 0.9rem;
  padding: 6px;
}
.thinking.active { display: block; }
.thinking::after {
  content: '';
  display: inline-block;
  animation: dots 1.2s infinite;
}
@keyframes dots {
  0%   { content: '.'; }
  33%  { content: '..'; }
  66%  { content: '...'; }
}

/* Turn indicator */
.turn-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: 'Cinzel', serif;
  font-size: 0.9rem;
  color: var(--text-dim);
}
.turn-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid;
}
.turn-dot.white-dot {
  background: #f0d9b5;
  border-color: #c0a070;
  box-shadow: 0 0 8px rgba(240,217,181,0.5);
}
.turn-dot.black-dot {
  background: #1a1008;
  border-color: #5a4030;
  box-shadow: 0 0 8px rgba(26,16,8,0.5);
}

/* Game over overlay */
#gameover-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
#gameover-overlay.active { display: flex; }
.gameover-box {
  background: var(--panel);
  border: 1px solid var(--gold-dim);
  border-radius: 12px;
  padding: 40px 48px;
  text-align: center;
  box-shadow: 0 0 60px rgba(201,168,76,0.15), var(--shadow);
  max-width: 360px;
}
.gameover-box h2 {
  font-family: 'Cinzel', serif;
  font-size: 1.8rem;
  color: var(--gold-bright);
  margin-bottom: 12px;
}
.gameover-box p {
  color: var(--text-dim);
  font-size: 1.1rem;
  font-style: italic;
  margin-bottom: 28px;
}
.gameover-box .btn-action { margin-bottom: 10px; }

/* Flipping board */
.board-flipped { transform: rotate(180deg); }
.board-flipped .piece { transform: rotate(180deg); }
.board-flipped .sq.selected .piece { transform: rotate(180deg) scale(1.1); }
</style>
</head>
<body>

<header>
  <h1>♟ CHESS ENGINE</h1>
  <p>A classical game, sharply implemented</p>
</header>

<!-- Setup Screen -->
<div id="setup-screen">
  <h2>New Game</h2>
  <div class="form-group">
    <label>Game Mode</label>
    <div class="btn-group">
      <button class="btn-toggle active" data-group="mode" data-val="pvai">vs Computer</button>
      <button class="btn-toggle" data-group="mode" data-val="pvp">Two Players</button>
    </div>
  </div>
  <div class="form-group" id="color-group">
    <label>Play As</label>
    <div class="btn-group">
      <button class="btn-toggle active" data-group="color" data-val="white">White</button>
      <button class="btn-toggle" data-group="color" data-val="black">Black</button>
    </div>
  </div>
  <div class="form-group" id="difficulty-group">
    <label>Difficulty — <span id="diff-label">Medium</span></label>
    <div class="difficulty-slider">
      <input type="range" id="difficulty" min="1" max="4" value="3"/>
      <div class="difficulty-labels">
        <span>Easy</span><span>Medium</span><span>Hard</span><span>Expert</span>
      </div>
    </div>
  </div>
  <button class="btn-start" onclick="startGame()">Begin Game</button>
</div>

<!-- Game Screen -->
<div id="game-screen">
  <div class="game-layout">

    <!-- Left Panel -->
    <div class="side-panel-left">
      <div class="panel-card">
        <h4>Status</h4>
        <div class="status-badge" id="status-text">White to move</div>
        <div class="thinking" id="thinking-indicator">Engine thinking</div>
      </div>
      <div class="panel-card">
        <h4>Captured by Black</h4>
        <div class="captured-pieces" id="captured-by-black"></div>
      </div>
      <div class="panel-card">
        <h4>Captured by White</h4>
        <div class="captured-pieces" id="captured-by-white"></div>
      </div>
    </div>

    <!-- Board Section -->
    <div class="board-section">
      <div class="turn-indicator">
        <div class="turn-dot white-dot" id="white-dot"></div>
        <span id="turn-text">White's Turn</span>
        <div class="turn-dot black-dot" id="black-dot"></div>
      </div>
      <div class="board-wrapper">
        <div style="display:flex">
          <div class="coords-ranks" id="ranks-label"></div>
          <div>
            <div id="board"></div>
            <div class="coords-files" id="files-label"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="side-panel-right">
      <div class="panel-card">
        <h4>Move History</h4>
        <div class="move-list" id="move-list"></div>
      </div>
      <button class="btn-action primary" onclick="undoMove()">↩ Undo Move</button>
      <button class="btn-action" onclick="newGame()">⊕ New Game</button>
    </div>

  </div>
</div>

<!-- Promotion Modal -->
<div id="promo-modal">
  <div class="promo-box">
    <h3>Promote Pawn</h3>
    <div class="promo-pieces" id="promo-choices"></div>
  </div>
</div>

<!-- Game Over Overlay -->
<div id="gameover-overlay">
  <div class="gameover-box">
    <h2 id="gameover-title">Checkmate!</h2>
    <p id="gameover-desc">White wins the game.</p>
    <button class="btn-action primary" onclick="newGame()" style="margin-bottom:0">Play Again</button>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const PIECE_UNICODE = {
  'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
  'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
};

let gameId = null;
let boardData = null;
let settings = { mode: 'pvai', color: 'white', difficulty: 3 };
let selected = null;       // square index
let legalTargets = [];     // uci strings for selected piece
let lastMove = null;       // {from, to}
let pendingPromo = null;   // {from, to, color}
let flipped = false;       // whether to render board flipped

// ─── Setup handlers ──────────────────────────────────────────────────────────
document.querySelectorAll('.btn-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const group = btn.dataset.group;
    document.querySelectorAll(`[data-group="${group}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    settings[group] = btn.dataset.val;
    if (group === 'mode') {
      document.getElementById('color-group').style.display = settings.mode === 'pvai' ? '' : 'none';
      document.getElementById('difficulty-group').style.display = settings.mode === 'pvai' ? '' : 'none';
    }
  });
});

const diffLabels = ['Easy','Medium','Hard','Expert'];
document.getElementById('difficulty').addEventListener('input', e => {
  document.getElementById('diff-label').textContent = diffLabels[e.target.value - 1];
  settings.difficulty = +e.target.value;
});

// ─── Game control ─────────────────────────────────────────────────────────────
async function startGame() {
  settings.difficulty = +document.getElementById('difficulty').value;
  const res = await fetch('/api/new_game', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ mode: settings.mode, player_color: settings.color, difficulty: settings.difficulty })
  });
  const data = await res.json();
  gameId = data.game_id;
  boardData = data.board;
  flipped = (settings.mode === 'pvai' && settings.color === 'black');
  lastMove = null;
  selected = null;
  legalTargets = [];

  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'block';
  document.getElementById('gameover-overlay').classList.remove('active');

  renderBoard(boardData, []);
  renderCoords();
  updateUI(boardData, []);

  // If playing as black, let AI go first
  if (settings.mode === 'pvai' && settings.color === 'black') {
    await triggerAIMove();
  }
}

function newGame() {
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('gameover-overlay').classList.remove('active');
  document.getElementById('setup-screen').style.display = 'block';
}

async function undoMove() {
  if (!gameId) return;
  const res = await fetch('/api/undo', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ game_id: gameId })
  });
  const data = await res.json();
  if (data.error) return;
  boardData = data.board;
  lastMove = null;
  selected = null;
  legalTargets = [];
  renderBoard(boardData, []);
  updateUI(boardData, data.history || []);
}

// ─── AI trigger (for when player plays as black) ──────────────────────────────
async function triggerAIMove() {
  setThinking(true);
  // We need a dummy move endpoint when AI goes first — instead
  // let's pass a sentinel. Actually we need to call a special endpoint.
  // For simplicity, let's request the first AI move via a pseudo-move.
  // We'll add a /api/ai_move endpoint for this.
  const res = await fetch('/api/ai_move', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ game_id: gameId })
  });
  const data = await res.json();
  setThinking(false);
  if (data.board) {
    boardData = data.board;
    if (data.move) lastMove = uciToFromTo(data.move);
    renderBoard(boardData, []);
    updateUI(boardData, data.history || []);
  }
}

// ─── Square click ─────────────────────────────────────────────────────────────
async function handleSquareClick(displayIdx) {
  if (!gameId || !boardData) return;
  if (boardData.checkmate || boardData.stalemate || boardData.insufficient) return;

  // Convert display index to board index
  const sqIdx = displayToBoard(displayIdx);

  // Check if it's the player's turn
  const isMyTurn = settings.mode === 'pvp' ||
    (boardData.turn === 'white' && settings.color === 'white') ||
    (boardData.turn === 'black' && settings.color === 'black');
  if (!isMyTurn) return;

  const row = Math.floor(sqIdx / 8);
  const col = sqIdx % 8;
  const piece = boardData.grid[row][col];

  // If something selected, try to move
  if (selected !== null) {
    const fromUci = sqToUci(selected);
    const toUci = sqToUci(sqIdx);
    const matchingMoves = legalTargets.filter(m => m.startsWith(fromUci + toUci));

    if (matchingMoves.length > 0) {
      // Promotion?
      if (matchingMoves.length > 1 || matchingMoves[0].length === 5) {
        await askPromotion(selected, sqIdx, matchingMoves);
      } else {
        await executeMove(matchingMoves[0]);
      }
      return;
    }

    // Clicked own piece — re-select
    if (piece && isPieceOwnedByCurrentTurn(piece)) {
      await selectSquare(sqIdx);
      return;
    }

    // Deselect
    selected = null;
    legalTargets = [];
    renderBoard(boardData, []);
    return;
  }

  // Select a piece
  if (piece && isPieceOwnedByCurrentTurn(piece)) {
    await selectSquare(sqIdx);
  }
}

function isPieceOwnedByCurrentTurn(piece) {
  if (boardData.turn === 'white') return piece === piece.toUpperCase();
  return piece === piece.toLowerCase();
}

async function selectSquare(sqIdx) {
  selected = sqIdx;
  const res = await fetch('/api/legal_moves', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ game_id: gameId, square: sqIdx })
  });
  const data = await res.json();
  legalTargets = data.moves || [];
  renderBoard(boardData, legalTargets);
}

async function askPromotion(from, to, moves) {
  pendingPromo = { from, to, moves };
  const isWhite = boardData.turn === 'white';
  const pieces = isWhite
    ? ['♕','♖','♗','♘']
    : ['♛','♜','♝','♞'];
  const keys = ['q','r','b','n'];
  const box = document.getElementById('promo-choices');
  box.innerHTML = '';
  keys.forEach((k, i) => {
    const btn = document.createElement('div');
    btn.className = 'promo-piece';
    btn.textContent = pieces[i];
    btn.onclick = () => choosePromotion(k);
    box.appendChild(btn);
  });
  document.getElementById('promo-modal').classList.add('active');
}

async function choosePromotion(piece) {
  document.getElementById('promo-modal').classList.remove('active');
  if (!pendingPromo) return;
  const { from, to } = pendingPromo;
  const uci = sqToUci(from) + sqToUci(to) + piece;
  pendingPromo = null;
  await executeMove(uci);
}

async function executeMove(uci) {
  selected = null;
  legalTargets = [];
  setThinking(true);

  const res = await fetch('/api/move', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ game_id: gameId, move: uci })
  });
  const data = await res.json();
  setThinking(false);

  if (data.error) { console.warn(data.error); return; }

  boardData = data.board;
  lastMove = uciToFromTo(data.ai_move || uci);
  renderBoard(boardData, []);
  updateUI(boardData, data.history || [], data.captured);
  checkGameOver(boardData);
}

// ─── Rendering ───────────────────────────────────────────────────────────────
function renderBoard(bd, legalMoves) {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';

  const legalToSet = new Set(legalMoves.map(m => uciToSq(m.slice(2, 4))));
  const legalFromSet = new Set(legalMoves.map(m => uciToSq(m.slice(0, 2))));

  const lastFrom = lastMove ? lastMove.from : -1;
  const lastTo   = lastMove ? lastMove.to   : -1;

  // Check king
  let checkKingIdx = -1;
  if (bd.in_check) {
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const p = bd.grid[r][c];
        if (bd.turn === 'white' && p === 'K') checkKingIdx = r*8+c;
        if (bd.turn === 'black' && p === 'k') checkKingIdx = r*8+c;
      }
    }
  }

  for (let di = 0; di < 64; di++) {
    const si = displayToBoard(di);
    const r = Math.floor(si / 8), c = si % 8;
    const piece = bd.grid[r][c];
    const isLight = (r + c) % 2 === 0;

    const sq = document.createElement('div');
    sq.className = 'sq ' + (isLight ? 'light' : 'dark');
    sq.dataset.di = di;

    if (si === selected) sq.classList.add('selected');
    if (si === lastFrom || si === lastTo) sq.classList.add('last-move');
    if (si === checkKingIdx) sq.classList.add('in-check');

    if (selected !== null) {
      if (legalToSet.has(si)) {
        if (piece) sq.classList.add('legal-capture');
        else sq.classList.add('legal-move');
      }
    }

    if (piece) {
      const span = document.createElement('span');
      const isWhitePiece = piece === piece.toUpperCase();
      span.className = 'piece ' + (isWhitePiece ? 'white-piece' : 'black-piece');
      span.textContent = PIECE_UNICODE[piece] || piece;
      sq.appendChild(span);
    }

    sq.addEventListener('click', () => handleSquareClick(di));
    boardEl.appendChild(sq);
  }
}

function renderCoords() {
  const ranks = document.getElementById('ranks-label');
  const files = document.getElementById('files-label');
  ranks.innerHTML = '';
  files.innerHTML = '';

  const rankLabels = flipped ? ['1','2','3','4','5','6','7','8'] : ['8','7','6','5','4','3','2','1'];
  const fileLabels = flipped ? ['h','g','f','e','d','c','b','a'] : ['a','b','c','d','e','f','g','h'];

  rankLabels.forEach(r => {
    const span = document.createElement('span');
    span.textContent = r;
    ranks.appendChild(span);
  });
  fileLabels.forEach(f => {
    const span = document.createElement('span');
    span.textContent = f;
    files.appendChild(span);
  });
}

function updateUI(bd, history, captured) {
  // Turn text
  const turnEl = document.getElementById('turn-text');
  const statusEl = document.getElementById('status-text');

  if (bd.checkmate) {
    const winner = bd.turn === 'white' ? 'Black' : 'White';
    turnEl.textContent = 'Game Over';
    statusEl.textContent = `Checkmate — ${winner} wins!`;
    statusEl.className = 'status-badge success';
  } else if (bd.stalemate) {
    turnEl.textContent = 'Game Over';
    statusEl.textContent = 'Stalemate — Draw';
    statusEl.className = 'status-badge';
  } else if (bd.insufficient) {
    turnEl.textContent = 'Game Over';
    statusEl.textContent = 'Insufficient Material — Draw';
    statusEl.className = 'status-badge';
  } else if (bd.in_check) {
    turnEl.textContent = bd.turn === 'white' ? "White's Turn" : "Black's Turn";
    statusEl.textContent = 'Check!';
    statusEl.className = 'status-badge danger';
  } else {
    turnEl.textContent = bd.turn === 'white' ? "White's Turn" : "Black's Turn";
    statusEl.textContent = bd.turn === 'white' ? 'White to move' : 'Black to move';
    statusEl.className = 'status-badge';
  }

  // Turn dots
  document.getElementById('white-dot').style.boxShadow = bd.turn === 'white'
    ? '0 0 12px rgba(240,217,181,0.8)' : 'none';
  document.getElementById('black-dot').style.boxShadow = bd.turn === 'black'
    ? '0 0 12px rgba(100,80,50,0.8)' : 'none';

  // Captured pieces
  if (captured) {
    document.getElementById('captured-by-black').innerHTML =
      (captured.black || []).map(p => PIECE_UNICODE[p.toUpperCase()] || p).join(' ');
    document.getElementById('captured-by-white').innerHTML =
      (captured.white || []).map(p => PIECE_UNICODE[p] || p).join(' ');
  }

  // Move history
  const ml = document.getElementById('move-list');
  ml.innerHTML = '';
  for (let i = 0; i < history.length; i += 2) {
    const pair = document.createElement('div');
    pair.className = 'move-pair';
    const num = document.createElement('span');
    num.className = 'move-num';
    num.textContent = (i/2 + 1) + '.';
    pair.appendChild(num);

    const m1 = document.createElement('span');
    m1.className = 'move-uci' + (i === history.length - 1 ? ' latest' : '');
    m1.textContent = history[i];
    pair.appendChild(m1);

    if (i + 1 < history.length) {
      const m2 = document.createElement('span');
      m2.className = 'move-uci' + (i + 1 === history.length - 1 ? ' latest' : '');
      m2.textContent = history[i+1];
      pair.appendChild(m2);
    }
    ml.appendChild(pair);
  }
  ml.scrollTop = ml.scrollHeight;
}

function checkGameOver(bd) {
  if (bd.checkmate || bd.stalemate || bd.insufficient) {
    const overlay = document.getElementById('gameover-overlay');
    const title = document.getElementById('gameover-title');
    const desc = document.getElementById('gameover-desc');
    if (bd.checkmate) {
      const winner = bd.turn === 'white' ? 'Black' : 'White';
      title.textContent = 'Checkmate!';
      desc.textContent = `${winner} wins the game.`;
    } else if (bd.stalemate) {
      title.textContent = 'Stalemate';
      desc.textContent = 'The game is a draw.';
    } else {
      title.textContent = 'Draw';
      desc.textContent = 'Insufficient material to checkmate.';
    }
    setTimeout(() => overlay.classList.add('active'), 600);
  }
}

function setThinking(v) {
  document.getElementById('thinking-indicator').classList.toggle('active', v);
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function displayToBoard(di) {
  if (!flipped) return di;
  return 63 - di;
}

function sqToUci(si) {
  const r = Math.floor(si / 8), c = si % 8;
  return 'abcdefgh'[c] + (8 - r);
}

function uciToSq(uci) {
  const c = 'abcdefgh'.indexOf(uci[0]);
  const r = 8 - parseInt(uci[1]);
  return r * 8 + c;
}

function uciToFromTo(uci) {
  if (!uci) return null;
  return { from: uciToSq(uci.slice(0, 2)), to: uciToSq(uci.slice(2, 4)) };
}
